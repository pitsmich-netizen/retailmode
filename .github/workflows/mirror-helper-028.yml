name: Mirror verified Retail Helper 0.2.8 APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mirror-helper-028.yml'

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Fetch and verify helper APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p provisioning
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
            'https://github.com/pitsmich-netizen/retailmode/releases/download/helper-028-test/RetailHelper.apk' \
            -o provisioning/RetailHelper-028.apk
          echo 'c7e52b3f676c81cd12368aa9179af04181e24e84a32b6517b8a3469ef68ffe1d  provisioning/RetailHelper-028.apk' | sha256sum -c -
      - name: Commit unchanged verified APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add provisioning/RetailHelper-028.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Mirror verified Retail Helper 0.2.8 APK'
            git push origin HEAD:main
          fi
