name: Publish verified test APKs automatically

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-verified-test-apks.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-retail-verified-smoke
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify APK checksum and package magic
        shell: bash
        run: |
          set -euo pipefail
          test -s provisioning/RetailDcp-100.apk
          test -s provisioning/RetailHelper-029.apk
          printf '%s\n' \
            '330f237fc5243b32d6e26cdc2d1666164106332512a1e6910638f563c7878b9b  provisioning/RetailDcp-100.apk' \
            '5382663fd48cd77ee805bb4ad272ebcd8e8ddc1ef1e978a1f40dc7cf59351220  provisioning/RetailHelper-029.apk' | sha256sum -c -
          file provisioning/RetailDcp-100.apk provisioning/RetailHelper-029.apk
          mkdir -p output
          cp provisioning/RetailDcp-100.apk output/RetailDcp.apk
          cp provisioning/RetailHelper-029.apk output/RetailHelper.apk
          sha256sum output/*.apk > output/SHA256SUMS.txt

      - name: Publish GitHub prerelease from checked APKs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='ci-smoke-20261108'
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Existing $TAG: refusing to overwrite a published release."
            gh release view "$TAG" --json url,name,assets
            exit 0
          fi
          gh release create "$TAG" \
            output/RetailDcp.apk \
            output/RetailHelper.apk \
            output/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "CI smoke test - DPC 0.10.0 + Helper 0.2.9" \
            --notes 'Automated publication proof. Verified existing test APKs, not rebuilt from source. Debug-signed; do not use for production or provisioning until separately tested.' \
            --prerelease
          gh release view "$TAG" --json url,assets

      - name: Publish checksums as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-smoke-apk-manifest
          path: output/SHA256SUMS.txt
