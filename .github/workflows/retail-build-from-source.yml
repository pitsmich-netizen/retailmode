name: Build Retail Setup All-In-One APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retail-build-from-source.yml'
      - 'android/retail-dpc/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retail-build-publish-main
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$MANAGER" ]; then MANAGER="$SDK/cmdline-tools/16.0/bin/sdkmanager"; fi
          "$MANAGER" --install 'platforms;android-36' 'build-tools;35.0.0'
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify pinned Samsung Retail Mode package
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --retry-all-errors --retry-delay 3 --connect-timeout 15 --max-time 120 \
            'https://raw.githubusercontent.com/pitsmich-netizen/retailmode/58bed6b59596e1ed82bb2526bbdb202f114a3391/provisioning/RetailMode.apk' -o /tmp/retailmode-test.apk
          test "$(stat -c '%s' /tmp/retailmode-test.apk)" = "34192143"
          echo 'da5ede9aa02aa278fa82b97caba8eb2e79a4e6fea9bdc5e3b50ebb3e5bc245c4  /tmp/retailmode-test.apk' | sha256sum -c -

      - name: Restore optional stable test key
        env:
          TEST_KEY: ${{ secrets.RETAIL_CI_DEBUG_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$TEST_KEY" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$TEST_KEY" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          else
            echo 'Ephemeral debug key: fresh factory wipe required.'
          fi

      - name: Compile single All-In-One APK
        shell: bash
        run: |
          set -euo pipefail
          test -f android/retail-dpc/app/src/main/java/com/example/retaildpc/demo/RetailAutomationService.java
          gradle --no-daemon -p android/retail-dpc :app:assembleDebug
          mkdir -p "provisioning/ci/${GITHUB_RUN_ID}" output
          cp android/retail-dpc/app/build/outputs/apk/debug/app-debug.apk "provisioning/ci/${GITHUB_RUN_ID}/RetailSetup.apk"
          cp "provisioning/ci/${GITHUB_RUN_ID}/RetailSetup.apk" output/RetailSetup.apk

      - name: Verify APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          apksigner verify --verbose --print-certs output/RetailSetup.apk
          aapt dump badging output/RetailSetup.apk | grep -E '^package:|^application-label:'
          test "$(find output -maxdepth 1 -name '*.apk' | wc -l)" -eq 1
          aapt dump xmltree output/RetailSetup.apk AndroidManifest.xml > /tmp/retail-setup-manifest.txt
          grep -F 'com.example.retaildpc' /tmp/retail-setup-manifest.txt >/dev/null
          grep -F 'AdminReceiver' /tmp/retail-setup-manifest.txt >/dev/null
          grep -F 'RetailAutomationService' /tmp/retail-setup-manifest.txt >/dev/null
          grep -F 'PROVISIONING_SUCCESSFUL' /tmp/retail-setup-manifest.txt >/dev/null
          # Prevent accidentally shipping a second Samsung test application icon
          # or the old OMC/diagnostic-only provisioning classes again.
          if grep -E 'ConsumerBaselineActivity|Test aplikacji Samsung|SamsungProvisioningProbe|SamsungOmcEnableProbe|MinimalOwnerProbe|com.pitsmich.samsungbaseline' /tmp/retail-setup-manifest.txt; then
            echo 'ERROR: unexpected consumer-test or OMC diagnostic component in Retail Setup APK'
            exit 1
          fi
          if find android/retail-dpc/app/src/main/java -type f \(             -name 'ConsumerBaselineActivity.java' -o             -name 'SamsungProvisioningProbe.java' -o             -name 'SamsungOmcEnableProbe.java' -o             -name 'MinimalOwnerProbe.java' -o             -name 'DiagnosticMode.java' \) | grep -q .; then
            echo 'ERROR: legacy diagnostic Java sources remain in the production module'
            exit 1
          fi
          if grep -q 'android:name=".ConsumerBaselineActivity"' android/retail-dpc/app/src/main/AndroidManifest.xml; then
            echo 'ERROR: unexpected diagnostic launcher in source manifest'
            exit 1
          fi
          test ! -e android/retail-dpc/baseline
          grep -F 'android:name=".LauncherActivity"' android/retail-dpc/app/src/main/AndroidManifest.xml >/dev/null
          grep -F 'android:exported="true" android:enabled="false"' android/retail-dpc/app/src/main/AndroidManifest.xml >/dev/null
          if grep -F 'com.example.retailhelper' /tmp/retail-setup-manifest.txt; then
            echo 'ERROR: Helper is still referenced in All-In-One manifest'
            exit 1
          fi
          echo 'VERIFIED: one All-In-One APK, DPC and Accessibility components, provisioning activity, no Helper references.'
          sha256sum output/RetailSetup.apk > output/SHA256SUMS.txt

      - name: Pin immutable APK URL
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "provisioning/ci/${GITHUB_RUN_ID}/RetailSetup.apk"
          git commit -m "CI ${GITHUB_RUN_ID}: stage signed Retail Setup All-In-One APK"
          git push origin HEAD:main
          C="$(git rev-parse HEAD)"
          echo "BUILD_SHA=$C" >> "$GITHUB_ENV"
          echo "RAW_URL=https://raw.githubusercontent.com/pitsmich-netizen/retailmode/$C/provisioning/ci/${GITHUB_RUN_ID}/RetailSetup.apk" >> "$GITHUB_ENV"

      - name: Publish one-APK release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(sha256sum output/RetailSetup.apk | cut -d' ' -f1)"
          printf 'RETAIL_SETUP_RAW_URL=%s\nRETAIL_SETUP_SHA256=%s\n' "$RAW_URL" "$SHA" > output/DEPLOYMENT.txt
          gh release create "ci-build-${GITHUB_RUN_ID}" \
            output/RetailSetup.apk output/SHA256SUMS.txt output/DEPLOYMENT.txt \
            --target "$BUILD_SHA" \
            --title "Retail Setup All-In-One CI ${GITHUB_RUN_ID}" \
            --notes 'Single Android DPC APK with dark UI and built-in demo automation. Experimental; physical Samsung testing required. No Wi-Fi/retail passwords in release.' \
            --prerelease

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retail-setup-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore
